project_id = "hzcubrhzoafrxwqrltjz"

# Buckets mirror production (all private). Created on `supabase start`.
[storage.buckets.letters]
public = false

[storage.buckets.faculty-logos]
public = false
file_size_limit = "1MiB"

[storage.buckets.faculty-signatures]
public = false
file_size_limit = "1MiB"

# Authenticator-app MFA for the admin screen. Hosted projects have it on by
# default (https://supabase.com/docs/guides/auth/auth-mfa/totp); the local
# stack refused enrollment until this was set.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.confirmation]
subject = "Confirm your signup"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset Your Password"
content_path = "./supabase/templates/reset_password.html"

[auth.email.template.invite]
subject = "You have been invited to ReadMyStudent"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your Login Link"
content_path = "./supabase/templates/magic_link.html"